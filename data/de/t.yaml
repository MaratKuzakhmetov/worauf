# yaml-language-server: $schema=../../schema/rektion.schema.json

teilen:
  pos: "verb"
  patterns:
    - prep: "mit"
      case: "dat"
      gloss:
        ru: "делить что-л. с кем-л."
        en: "to share sth. with sb."
      examples:
        - de: "Sie teilt das Zimmer mit ihrer Schwester."
          ru: "Она делит комнату со своей сестрой."
          en: "She shares the room with her sister."
      sources:
        - "duden"
      senseNote:
        ru: "с кем делишь — второй участник"
        en: "whom you share with — the other party"
    - prep: "in"
      case: "akk"
      reflexive: "akk"
      gloss:
        ru: "делить между собой что-л. (выигрыш, имущество)"
        en: "to split sth. between themselves (a prize, property)"
      examples:
        - de: "Wir teilen uns in den Gewinn."
          ru: "Мы делим выигрыш между собой."
          en: "We are splitting the winnings between us."
      sources:
        - "duden"
      senseNote:
        ru: "что делят между собой — сам предмет дележа, а не партнёр"
        en: "what gets divided up — the thing itself, not the partner"

Teilnahme:
  pos: "noun"
  article: "die"
  patterns:
    - prep: "an"
      case: "dat"
      gloss:
        ru: "участие в чём-л."
        en: "participation in sth."
      examples:
        - de: "Die Teilnahme an dem Seminar ist kostenlos."
          ru: "Участие в семинаре бесплатное."
          en: "Participation in the seminar is free."
      sources:
        - "prototype"

teilnehmen:
  pos: "verb"
  patterns:
    - prep: "an"
      case: "dat"
      level: "B1"
      gloss:
        ru: "участвовать в чём-л."
        en: "to take part in sth."
      examples:
        - de: "Er nimmt an dem Wettbewerb teil."
          ru: "Он участвует в конкурсе."
          en: "He is taking part in the competition."
      sources:
        - "seed"

telefonieren:
  pos: "verb"
  patterns:
    - prep: "mit"
      case: "dat"
      level: "A2"
      gloss:
        ru: "говорить по телефону с кем-л."
        en: "to speak on the phone with sb."
      examples:
        - de: "Sie telefoniert mit ihrem Vater."
          ru: "Она говорит по телефону с отцом."
          en: "She is on the phone with her father."
      sources:
        - "seed"

trainieren:
  pos: "verb"
  patterns:
    - prep: "für"
      case: "akk"
      gloss:
        ru: "тренироваться к чему-л."
        en: "to train for sth."
      examples:
        - de: "Er trainiert hart für die nächsten Spiele."
          ru: "Он усердно тренируется к следующим играм."
          en: "He is training hard for the next games."
      sources:
        - "duden"

Trauer:
  pos: "noun"
  article: "die"
  patterns:
    - prep: "über"
      case: "akk"
      gloss:
        ru: "печаль из-за чего-л."
        en: "grief over sth."
      senseNote:
        ru: "печаль из-за события или потери в целом"
        en: "grief over an event or a loss in general"
      examples:
        - de: "Die Trauer über den Verlust war groß."
          ru: "Печаль из-за потери была велика."
          en: "The grief over the loss was great."
      sources:
        - "duden"
    - prep: "um"
      case: "akk"
      gloss:
        ru: "скорбь по кому-л. (об умершем)"
        en: "mourning for sb. (the deceased)"
      senseNote:
        ru: "скорбь по конкретному умершему человеку"
        en: "mourning for a specific person who died"
      examples:
        - de: "Die Trauer um ihren Vater dauert an."
          ru: "Скорбь по отцу не утихает."
          en: "The mourning for her father continues."
      sources:
        - "duden"

Traum:
  pos: "noun"
  article: "der"
  patterns:
    - prep: "von"
      case: "dat"
      gloss:
        ru: "мечта о чём-л."
        en: "dream of sth."
      examples:
        - de: "Der Traum vom Glück begleitet ihn."
          ru: "Мечта о счастье сопровождает его."
          en: "The dream of happiness accompanies him."
      sources:
        - "duden"

träumen:
  pos: "verb"
  patterns:
    - prep: "von"
      case: "dat"
      level: "A2"
      gloss:
        ru: "мечтать о чём-л., видеть во сне что-л."
        en: "to dream of sth."
      examples:
        - de: "Er träumt von einem eigenen Haus."
          ru: "Он мечтает о собственном доме."
          en: "He dreams of a house of his own."
      sources:
        - "seed"

traurig:
  pos: "adj"
  patterns:
    - prep: "über"
      case: "akk"
      gloss:
        ru: "опечаленный чем-л."
        en: "sad about sth."
      examples:
        - de: "Er ist traurig über den Verlust."
          ru: "Он опечален потерей."
          en: "He is sad about the loss."
      sources:
        - "prototype"

treffen:
  pos: "verb"
  patterns:
    - prep: "mit"
      case: "dat"
      reflexive: "akk"
      gloss:
        ru: "встречаться с кем-л."
        en: "to meet with sb."
      examples:
        - de: "Ich treffe mich mit den Freunden."
          ru: "Я встречаюсь с друзьями."
          en: "I am meeting with the friends."
      sources:
        - "prototype"

trennen:
  pos: "verb"
  patterns:
    - prep: "von"
      case: "dat"
      reflexive: "akk"
      gloss:
        ru: "расставаться с кем-л. / чем-л."
        en: "to part with sb. / sth."
      examples:
        - de: "Die Firma hat sich von diesem Mitarbeiter getrennt."
          ru: "Фирма рассталась с этим сотрудником."
          en: "The company parted with this employee."
      sources:
        - "duden"

trinken:
  pos: "verb"
  patterns:
    - prep: "auf"
      case: "akk"
      gloss:
        ru: "пить за кого-л. / что-л. (произносить тост)"
        en: "to drink to sb. / sth., to toast sb. / sth."
      examples:
        - de: "Wir trinken auf einen guten Ausgang."
          ru: "Мы пьём за благополучный исход."
          en: "We are drinking to a good outcome."
      sources:
        - "duden"

tüfteln:
  pos: "verb"
  patterns:
    - prep: "an"
      case: "dat"
      gloss:
        ru: "корпеть над чем-л., возиться с чем-л."
        en: "to tinker with sth."
      examples:
        - de: "Er tüftelt an der Maschine."
          ru: "Он корпит над машиной."
          en: "He is tinkering with the machine."
      sources:
        - "en.wiktionary"
        - "duden"

typisch:
  pos: "adj"
  patterns:
    - prep: "für"
      case: "akk"
      gloss:
        ru: "типичный для кого-л. / чего-л."
        en: "typical of sb. / sth."
      examples:
        - de: "Das ist typisch für ihn."
          ru: "Это типично для него."
          en: "That is typical of him."
      sources:
        - "prototype"
