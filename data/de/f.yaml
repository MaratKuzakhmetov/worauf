# yaml-language-server: $schema=../../schema/rektion.schema.json

fähig:
  pos: "adj"
  patterns:
    - prep: "zu"
      case: "dat"
      gloss:
        ru: "способный на что-л."
        en: "capable of sth."
      examples:
        - de: "Er ist zu einer solchen Tat fähig."
          ru: "Он способен на такой поступок."
          en: "He is capable of such an act."
      sources:
        - "prototype"

fahren:
  pos: "verb"
  patterns:
    - prep: "mit"
      case: "dat"
      gloss:
        ru: "ехать на чём-л. (о транспорте)"
        en: "to go by sth. (a means of transport)"
      examples:
        - de: "Wir fahren mit dem Zug nach Berlin."
          ru: "Мы едем в Берлин на поезде."
          en: "We are going to Berlin by train."
      sources:
        - "en.wiktionary"
        - "duden"

fallen:
  pos: "verb"
  patterns:
    - prep: "auf"
      case: "akk"
      gloss:
        ru: "выпадать на какой-л. день"
        en: "to fall on a day (a date, a holiday)"
      examples:
        - de: "Weihnachten fällt auf einen Sonntag."
          ru: "Рождество выпадает на воскресенье."
          en: "Christmas falls on a Sunday."
      sources:
        - "en.wiktionary"
        - "duden"
      senseNote:
        ru: "на что выпадает — календарная дата, а не категория"
        en: "what date it falls on — a calendar date, not a category"
    - prep: "in"
      case: "akk"
      gloss:
        ru: "относиться к чему-л. (компетенции, категории)"
        en: "to fall within sth. (a jurisdiction, a category)"
      examples:
        - de: "Das fällt nicht in die Zuständigkeit der Gemeinde."
          ru: "Это не относится к компетенции общины."
          en: "That doesn't fall within the municipality's jurisdiction."
      sources:
        - "en.wiktionary"
        - "duden"
      senseNote:
        ru: "в какую категорию попадает — сфера ответственности, а не дата"
        en: "what category it falls into — an area of responsibility, not a date"

fehlen:
  pos: "verb"
  patterns:
    - prep: "an"
      case: "dat"
      gloss:
        ru: "не хватать чего-л. — es fehlt an"
        en: "to be lacking — es fehlt an"
      examples:
        - de: "Es fehlt an dem nötigen Geld."
          ru: "Не хватает нужных денег."
          en: "The necessary money is lacking."
      sources:
        - "prototype"

feilen:
  pos: "verb"
  patterns:
    - prep: "an"
      case: "dat"
      gloss:
        ru: "оттачивать что-л., дорабатывать что-л. (перен.)"
        en: "to polish sth., to work on refining sth. (figuratively)"
      examples:
        - de: "Sie feilt an ihrem Vortrag."
          ru: "Она дорабатывает свой доклад."
          en: "She is polishing her presentation."
      sources:
        - "en.wiktionary"
        - "duden"

feilschen:
  pos: "verb"
  patterns:
    - prep: "um"
      case: "akk"
      gloss:
        ru: "торговаться за что-л., торговаться о чём-л."
        en: "to haggle over sth."
      examples:
        - de: "Sie feilscht um den Preis."
          ru: "Она торгуется за цену."
          en: "She is haggling over the price."
      sources:
        - "en.wiktionary"
        - "duden"

fertig:
  pos: "adj"
  patterns:
    - prep: "mit"
      case: "dat"
      gloss:
        ru: "закончивший с чем-л."
        en: "finished with sth."
      examples:
        - de: "Bist du mit der Arbeit fertig?"
          ru: "Ты закончил работу?"
          en: "Are you finished with the work?"
      sources:
        - "prototype"
      senseNote:
        ru: "с чем закончил — задача уже выполнена"
        en: "what you are finished with — a task already completed"
    - prep: "für"
      case: "akk"
      gloss:
        ru: "готовый к чему-л."
        en: "ready for sth."
      examples:
        - de: "Er ist fertig für den Wettkampf."
          ru: "Он готов к соревнованию."
          en: "He is ready for the competition."
      sources:
        - "en.wiktionary"
        - "duden"
      senseNote:
        ru: "к чему готов — предстоящее событие, а не завершённая задача"
        en: "what you are ready for — something ahead of you, not a finished task"

fertigwerden:
  pos: "verb"
  patterns:
    - prep: "mit"
      case: "dat"
      gloss:
        ru: "справляться с кем-л. / чем-л."
        en: "to cope with sb. / sth."
      examples:
        - de: "Sie wird mit dem Stress nicht fertig."
          ru: "Она не справляется со стрессом."
          en: "She cannot cope with the stress."
          lemmaForm: wird
      sources:
        - "en.wiktionary"
        - "duden"

festbeißen:
  pos: "verb"
  patterns:
    - prep: "an"
      case: "dat"
      reflexive: "akk"
      gloss:
        ru: "зацикливаться на чём-л. (перен.)"
        en: "to fixate on sth. (figuratively)"
      examples:
        - de: "Sie hat sich an diesem Fall festgebissen."
          ru: "Она зациклилась на этом деле."
          en: "She has fixated on this case."
          lemmaForm: festgebissen
      sources:
        - "en.wiktionary"
        - "duden"

festhalten:
  pos: "verb"
  patterns:
    - prep: "an"
      case: "dat"
      gloss:
        ru: "твёрдо держаться чего-л. (мнения, традиции)"
        en: "to stick to sth. (an opinion, a tradition)"
      examples:
        - de: "Sie hält an ihrer Meinung fest."
          ru: "Она твёрдо держится своего мнения."
          en: "She sticks to her opinion."
          lemmaForm: hält
      sources:
        - "en.wiktionary"
        - "duden"

festmachen:
  pos: "verb"
  patterns:
    - prep: "an"
      case: "dat"
      gloss:
        ru: "связывать что-л. с чем-л., объяснять что-л. чем-л. (перен.)"
        en: "to attribute sth. to sth., to pin sth. down to sth. (figuratively)"
      examples:
        - de: "Man kann das Problem nicht allein an einer Ursache festmachen."
          ru: "Нельзя объяснить проблему одной-единственной причиной."
          en: "One cannot attribute the problem solely to one cause."
      sources:
        - "en.wiktionary"
        - "duden"

festnageln:
  pos: "verb"
  patterns:
    - prep: "auf"
      case: "akk"
      gloss:
        ru: "припирать кого-л. к стенке, ловить кого-л. на слове"
        en: "to pin sb. down to sth. (a statement, a promise)"
      examples:
        - de: "Sie ließ sich nicht auf eine Aussage festnageln."
          ru: "Она не позволила поймать себя на слове."
          en: "She would not let herself be pinned down to a statement."
      sources:
        - "en.wiktionary"
        - "duden"

fliehen:
  pos: "verb"
  patterns:
    - prep: "vor"
      case: "dat"
      gloss:
        ru: "бежать от чего-л."
        en: "to flee from sth."
      examples:
        - de: "Sie fliehen vor dem Krieg."
          ru: "Они бегут от войны."
          en: "They are fleeing from the war."
      sources:
        - "prototype"

flüchten:
  pos: "verb"
  patterns:
    - prep: "vor"
      case: "dat"
      gloss:
        ru: "спасаться бегством от чего-л."
        en: "to flee from sth., to escape sth."
      examples:
        - de: "Die Menschen flüchten vor der Verfolgung."
          ru: "Люди спасаются бегством от преследования."
          en: "People are fleeing from persecution."
      sources:
        - "en.wiktionary"
        - "duden"
      senseNote:
        ru: "от чего бежишь — источник опасности"
        en: "what you flee from — the source of danger"
    - prep: "in"
      case: "akk"
      reflexive: "akk"
      gloss:
        ru: "укрыться, спастись бегством куда-л."
        en: "to take refuge in sth. (a place)"
      examples:
        - de: "Sie flüchten sich in eine Hütte."
          ru: "Они укрываются в хижине."
          en: "They take refuge in a hut."
      sources:
        - "en.wiktionary"
        - "duden"
      senseNote:
        ru: "куда укрываешься — пункт назначения, а не источник опасности"
        en: "where you take refuge — the destination, not the danger"

folgen:
  pos: "verb"
  patterns:
    - prep: "aus"
      case: "dat"
      gloss:
        ru: "следовать из чего-л."
        en: "to follow from sth."
      examples:
        - de: "Was folgt aus diesem Ergebnis?"
          ru: "Что следует из этого результата?"
          en: "What follows from this result?"
      sources:
        - "prototype"

folgern:
  pos: "verb"
  patterns:
    - prep: "aus"
      case: "dat"
      gloss:
        ru: "делать вывод из чего-л., заключать из чего-л."
        en: "to conclude from sth., to infer from sth."
      examples:
        - de: "Man kann aus seinem Schweigen folgern, dass er zustimmt."
          ru: "Из его молчания можно заключить, что он согласен."
          en: "One can conclude from his silence that he agrees."
      sources:
        - "en.wiktionary"
        - "duden"

Folgerung:
  pos: "noun"
  article: "die"
  patterns:
    - prep: "aus"
      case: "dat"
      gloss:
        ru: "вывод из чего-л."
        en: "a conclusion drawn from sth."
      examples:
        - de: "Er zog eine wichtige Folgerung aus den Testergebnissen."
          ru: "Он сделал важный вывод из результатов теста."
          en: "He drew an important conclusion from the test results."
      sources:
        - "duden"

Frage:
  pos: "noun"
  article: "die"
  patterns:
    - prep: "nach"
      case: "dat"
      gloss:
        ru: "вопрос о чём-л."
        en: "question about sth."
      examples:
        - de: "Die Frage nach dem Sinn bleibt offen."
          ru: "Вопрос о смысле остаётся открытым."
          en: "The question about meaning remains open."
      sources:
        - "prototype"
      senseNote:
        ru: "о чём вопрос — та вещь, которую хотят узнать"
        en: "what the question is about — the thing you want to find out"
    - prep: "an"
      case: "akk"
      gloss:
        ru: "вопрос к кому-л."
        en: "question for sb."
      examples:
        - de: "Ich habe eine Frage an den Lehrer."
          ru: "У меня вопрос к учителю."
          en: "I have a question for the teacher."
      sources:
        - "en.wiktionary"
        - "duden"
      senseNote:
        ru: "кому вопрос адресован — собеседник, а не тема"
        en: "who the question is addressed to — the person, not the topic"
    - prep: "zu"
      case: "dat"
      gloss:
        ru: "вопрос по поводу чего-л."
        en: "question regarding sth."
      examples:
        - de: "Haben Sie Fragen zu dem Thema?"
          ru: "У вас есть вопросы по теме?"
          en: "Do you have questions regarding the topic?"
      sources:
        - "prototype"
      senseNote:
        ru: "по какой теме вопрос — привязка к тому, что уже обсуждают"
        en: "which topic the question attaches to — something already on the table"

fragen:
  pos: "verb"
  patterns:
    - prep: "nach"
      case: "dat"
      level: "A2"
      gloss:
        ru: "спрашивать о ком-л. / чём-л."
        en: "to ask after sb. / sth."
      examples:
        - de: "Er fragt nach dem Weg."
          ru: "Он спрашивает дорогу."
          en: "He asks the way."
      sources:
        - "seed"

fressen:
  pos: "verb"
  patterns:
    - prep: "an"
      case: "dat"
      gloss:
        ru: "разъедать что-л., точить кого-л. (перен., о тревоге, ржавчине)"
        en: "to eat away at sth., to gnaw at sb. (figurative, of worry, corrosion)"
      senseNote:
        ru: "переносное значение — не о еде животных"
        en: "figurative sense — not about an animal eating"
      examples:
        - de: "Säure frisst am Metall."
          ru: "Кислота разъедает металл."
          en: "Acid eats away at the metal."
          lemmaForm: frisst
      sources:
        - "duden"

Freude:
  pos: "noun"
  article: "die"
  patterns:
    - prep: "an"
      case: "dat"
      gloss:
        ru: "радость от занятия чем-л."
        en: "enjoyment of sth."
      examples:
        - de: "Er hat Freude an der Arbeit."
          ru: "Ему в радость работа."
          en: "He takes enjoyment in his work."
      sources:
        - "prototype"
      senseNote:
        ru: "удовольствие от занятия — длится, пока длится само дело"
        en: "enjoyment of an activity — it lasts as long as the activity does"
    - prep: "über"
      case: "akk"
      gloss:
        ru: "радость по поводу чего-л."
        en: "joy about sth."
      examples:
        - de: "Die Freude über den Sieg war groß."
          ru: "Радость от победы была большой."
          en: "The joy about the victory was great."
      sources:
        - "prototype"
      senseNote:
        ru: "радость по поводу события, которое уже случилось"
        en: "joy about an event that has already happened"

freuen:
  pos: "verb"
  patterns:
    - prep: "auf"
      case: "akk"
      level: "A2"
      gloss:
        ru: "предвкушать что-л., радоваться предстоящему"
        en: "to look forward to sth."
      senseNote:
        ru: "событие ещё впереди — это предвкушение"
        en: "the event is still ahead — anticipation"
      examples:
        - de: "Ich freue mich auf den Urlaub."
          ru: "Я предвкушаю отпуск."
          en: "I am looking forward to the holiday."
      clause:
        dass: true
        zuInf: true
        indirect: false
      sources:
        - "seed"
      reflexive: "akk"
    - prep: "über"
      case: "akk"
      level: "A2"
      gloss:
        ru: "радоваться тому, что уже случилось"
        en: "to be glad about sth. that has happened"
      senseNote:
        ru: "событие уже произошло — тот же падеж, другое время события"
        en: "the event has already happened — same case, different moment"
      examples:
        - de: "Sie freut sich über das Geschenk."
          ru: "Она рада подарку."
          en: "She is glad about the present."
      clause:
        dass: true
        zuInf: false
        indirect: false
      sources:
        - "seed"
      reflexive: "akk"
    - prep: "für"
      case: "akk"
      gloss:
        ru: "радоваться за кого-л."
        en: "to be happy for sb."
      senseNote:
        ru: "радость не своя, а чужая — радуешься за другого"
        en: "the joy is not your own — you are glad on someone else's behalf"
      examples:
        - de: "Ich freue mich für dich."
          ru: "Я рад за тебя."
          en: "I am happy for you."
      sources:
        - "en.wiktionary"
        - "duden"
      reflexive: "akk"

freundlich:
  pos: "adj"
  patterns:
    - prep: "zu"
      case: "dat"
      gloss:
        ru: "приветливый с кем-л."
        en: "friendly towards sb."
      examples:
        - de: "Sei freundlich zu den Gästen!"
          ru: "Будь приветлив с гостями!"
          en: "Be friendly towards the guests!"
      sources:
        - "prototype"

froh:
  pos: "adj"
  patterns:
    - prep: "über"
      case: "akk"
      gloss:
        ru: "радостный из-за чего-л., довольный чем-л."
        en: "glad about sth."
      examples:
        - de: "Ich bin froh über den Erfolg."
          ru: "Я рад успеху."
          en: "I am glad about the success."
      sources:
        - "en.wiktionary"
        - "duden"

führen:
  pos: "verb"
  patterns:
    - prep: "zu"
      case: "dat"
      gloss:
        ru: "приводить к чему-л."
        en: "to lead to sth."
      examples:
        - de: "Das führt zu einem Konflikt."
          ru: "Это приводит к конфликту."
          en: "That leads to a conflict."
      sources:
        - "prototype"

Furcht:
  pos: "noun"
  article: "die"
  patterns:
    - prep: "vor"
      case: "dat"
      gloss:
        ru: "страх перед кем-л. / чем-л."
        en: "fear of sb. / sth."
      examples:
        - de: "Die Furcht vor dem Tod begleitete ihn sein Leben lang."
          ru: "Страх перед смертью сопровождал его всю жизнь."
          en: "The fear of death accompanied him his whole life."
      sources:
        - "duden"

fürchten:
  pos: "verb"
  patterns:
    - prep: "vor"
      case: "dat"
      reflexive: "akk"
      gloss:
        ru: "бояться чего-л."
        en: "to be afraid of sth."
      examples:
        - de: "Er fürchtet sich vor der Dunkelheit."
          ru: "Он боится темноты."
          en: "He is afraid of the dark."
      sources:
        - "prototype"

fußen:
  pos: "verb"
  patterns:
    - prep: "auf"
      case: "dat"
      gloss:
        ru: "основываться на чём-л., опираться на что-л."
        en: "to be based on sth., to rest on sth."
      examples:
        - de: "Die Entscheidung fußt auf einem Vertrag."
          ru: "Решение основывается на договоре."
          en: "The decision is based on a contract."
      sources:
        - "duden"
