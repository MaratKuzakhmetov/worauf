# yaml-language-server: $schema=../../schema/rektion.schema.json

Dank:
  pos: "noun"
  article: "der"
  patterns:
    - prep: "für"
      case: "akk"
      gloss:
        ru: "благодарность за что-л."
        en: "thanks for sth."
      examples:
        - de: "Er sprach seinen Dank für den Empfang aus."
          ru: "Он выразил благодарность за приём."
          en: "He expressed his thanks for the reception."
      sources:
        - "duden"

dankbar:
  pos: "adj"
  patterns:
    - prep: "für"
      case: "akk"
      gloss:
        ru: "благодарный за что-л."
        en: "grateful for sth."
      examples:
        - de: "Ich bin dir dankbar für die Hilfe."
          ru: "Я тебе благодарен за помощь."
          en: "I am grateful to you for the help."
      sources:
        - "prototype"

danken:
  pos: "verb"
  patterns:
    - prep: "für"
      case: "akk"
      level: "A2"
      gloss:
        ru: "благодарить за что-л."
        en: "to thank for sth."
      examples:
        - de: "Ich danke dir für den Brief."
          ru: "Спасибо тебе за письмо."
          en: "Thank you for the letter."
      sources:
        - "seed"

denken:
  pos: "verb"
  patterns:
    - prep: "an"
      case: "akk"
      level: "A2"
      gloss:
        ru: "думать о ком-л. / чём-л. — держать в мыслях"
        en: "to think of sb. / sth. — keep in mind"
      senseNote:
        ru: "держишь в мыслях, вспоминаешь, не забываешь — мнения тут нет"
        en: "keeping something in mind or remembering it — no opinion involved"
      examples:
        - de: "Ich denke oft an meinen Großvater."
          ru: "Я часто думаю о дедушке."
          en: "I often think of my grandfather."
      clause:
        dass: true
        zuInf: true
        indirect: false
      sources:
        - "seed"
    - prep: "über"
      case: "akk"
      level: "B1"
      gloss:
        ru: "думать о чём-л. — иметь мнение"
        en: "to think about sth. — have an opinion"
      senseNote:
        ru: "имеешь мнение, оцениваешь — вопрос «как ты к этому относишься»"
        en: "holding an opinion — the question is what you make of it"
      examples:
        - de: "Wie denkst du über den Vorschlag?"
          ru: "Что ты думаешь об этом предложении?"
          en: "What do you think about the proposal?"
      sources:
        - "seed"

deuten:
  pos: "verb"
  patterns:
    - prep: "auf"
      case: "akk"
      gloss:
        ru: "указывать на что-л. (о признаках)"
        en: "to point to sth. (of signs, indications)"
      examples:
        - de: "Die Zeichen deuten auf einen Wandel."
          ru: "Признаки указывают на перемену."
          en: "The signs point to a change."
      sources:
        - "en.wiktionary"
        - "duden"

die Weichen stellen:
  pos: "verb"
  patterns:
    - prep: "für"
      case: "akk"
      gloss:
        ru: "определять направление развития чего-л."
        en: "to set the course for sth."
      examples:
        - de: "Das Kabinett hat die Weichen für die Steuerreform gestellt."
          ru: "Кабинет министров определил направление налоговой реформы."
          en: "The cabinet set the course for the tax reform."
          lemmaForm: gestellt
      sources:
        - "en.wiktionary"
        - "duden"

dienen:
  pos: "verb"
  patterns:
    - prep: "bei"
      case: "dat"
      gloss:
        ru: "служить у кого-л."
        en: "to serve under sb."
      examples:
        - de: "Er hat drei Jahre bei diesem General gedient."
          ru: "Он три года служил у этого генерала."
          en: "He served under this general for three years."
      sources:
        - "en.wiktionary"
        - "duden"

differenzieren:
  pos: "verb"
  patterns:
    - prep: "zwischen"
      case: "dat"
      gloss:
        ru: "различать, проводить различие между чем-л."
        en: "to differentiate between sth."
      examples:
        - de: "Man muss zwischen diesen beiden Erscheinungen differenzieren."
          ru: "Нужно различать эти два явления."
          en: "One has to differentiate between these two phenomena."
      sources:
        - "duden"

Diskussion:
  pos: "noun"
  article: "die"
  patterns:
    - prep: "über"
      case: "akk"
      gloss:
        ru: "дискуссия о чём-л."
        en: "discussion about sth."
      examples:
        - de: "Die Diskussion über den Vorschlag hält an."
          ru: "Дискуссия о предложении продолжается."
          en: "The discussion about the proposal continues."
      sources:
        - "duden"

diskutieren:
  pos: "verb"
  patterns:
    - prep: "mit"
      case: "dat"
      gloss:
        ru: "обсуждать с кем-л."
        en: "to discuss with sb."
      examples:
        - de: "Ich diskutiere mit den Kollegen."
          ru: "Я обсуждаю с коллегами."
          en: "I am discussing it with the colleagues."
      sources:
        - "prototype"
      senseNote:
        ru: "с кем обсуждаешь — собеседник"
        en: "whom you discuss with — the other party"
    - prep: "über"
      case: "akk"
      level: "B1"
      gloss:
        ru: "обсуждать что-л."
        en: "to discuss sth."
      examples:
        - de: "Wir diskutieren über den Plan."
          ru: "Мы обсуждаем план."
          en: "We are discussing the plan."
      sources:
        - "seed"
      senseNote:
        ru: "что обсуждаешь — тема"
        en: "what you discuss — the topic"

Drang:
  pos: "noun"
  article: "der"
  patterns:
    - prep: "nach"
      case: "dat"
      gloss:
        ru: "стремление к чему-л. (внутреннее, неудержимое)"
        en: "urge for sth., drive for sth."
      examples:
        - de: "Er verspürt einen starken Drang nach Freiheit."
          ru: "Он испытывает сильное стремление к свободе."
          en: "He feels a strong urge for freedom."
      sources:
        - "duden"

drehen:
  pos: "verb"
  patterns:
    - prep: "um"
      case: "akk"
      reflexive: "akk"
      gloss:
        ru: "речь идёт о чём-л. (перен.)"
        en: "to be about sth., to concern sth. (figuratively)"
      examples:
        - de: "Das Gespräch dreht sich um Politik."
          ru: "Разговор идёт о политике."
          en: "The conversation is about politics."
      sources:
        - "en.wiktionary"
        - "duden"

dringen:
  pos: "verb"
  patterns:
    - prep: "auf"
      case: "akk"
      gloss:
        ru: "настаивать на чём-л., требовать чего-л."
        en: "to press for sth., to insist on sth."
      examples:
        - de: "Die Firma dringt auf einen schnellen Abschluss."
          ru: "Фирма настаивает на быстром завершении."
          en: "The company is pressing for a quick conclusion."
      sources:
        - "en.wiktionary"
        - "duden"

drohen:
  pos: "verb"
  patterns:
    - prep: "mit"
      case: "dat"
      gloss:
        ru: "угрожать чем-л."
        en: "to threaten sb. with sth."
      examples:
        - de: "Er droht mir mit einer Anzeige."
          ru: "Он угрожает мне заявлением в полицию."
          en: "He is threatening me with a police report."
      sources:
        - "en.wiktionary"
        - "duden"

drücken:
  pos: "verb"
  patterns:
    - prep: "auf"
      case: "akk"
      gloss:
        ru: "нажимать на что-л."
        en: "to press sth."
      senseNote:
        ru: "буквально нажимаешь на предмет — не о том, что избегаешь"
        en: "a literal press on an object — not about avoiding something"
      examples:
        - de: "Sie drückt auf den Knopf."
          ru: "Она нажимает на кнопку."
          en: "She presses the button."
      sources:
        - "en.wiktionary"
        - "duden"
    - prep: "vor"
      case: "dat"
      reflexive: "akk"
      gloss:
        ru: "уклоняться от чего-л."
        en: "to shirk sth., to dodge sth."
      senseNote:
        ru: "переносное — избегаешь дела, а не нажимаешь на предмет"
        en: "figurative — you avoid a task, not literally press on something"
      examples:
        - de: "Du drückst dich gern vor der Arbeit."
          ru: "Ты любишь уклоняться от работы."
          en: "You like to dodge work."
      sources:
        - "en.wiktionary"
        - "duden"

durchessen:
  pos: "verb"
  patterns:
    - prep: "bei"
      case: "dat"
      reflexive: "akk"
      gloss:
        ru: "объедать кого-л., жить за чей-л. счёт (о еде)"
        en: "to eat at sb.'s expense repeatedly"
      examples:
        - de: "Er isst sich ungeniert bei all seinen Bekannten durch."
          ru: "Он беззастенчиво объедает всех своих знакомых."
          en: "He shamelessly eats at the expense of all his acquaintances."
          lemmaForm: isst
      sources:
        - "en.wiktionary"
        - "duden"

durchfallen:
  pos: "verb"
  patterns:
    - prep: "bei"
      case: "dat"
      gloss:
        ru: "провалить что-л. (экзамен, голосование)"
        en: "to fail sth. (an exam, a vote)"
      examples:
        - de: "Er ist bei der Prüfung durchgefallen."
          ru: "Он провалил экзамен."
          en: "He failed the exam."
          lemmaForm: durchgefallen
      sources:
        - "en.wiktionary"
        - "duden"
