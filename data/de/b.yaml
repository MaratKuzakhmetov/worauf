          ru: "Команда состоит из пяти человек."
          en: "The team consists of five people."
      sources:
        - "seed"
    - prep: "in"
      case: "dat"
      level: "B2"
      gloss:
        ru: "заключаться в чём-л."
        en: "to lie in sth."
      senseNote:
        ru: "о сути — в чём состоит проблема, задача, различие"
        en: "about essence — what the problem or difference consists in"
      examples:
        - de: "Die Schwierigkeit besteht in den Kosten."
          ru: "Трудность заключается в расходах."
          en: "The difficulty lies in the costs."
      clause:
        dass: true
        zuInf: false
        indirect: false
      sources:
        - "seed"

