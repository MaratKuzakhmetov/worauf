# yaml-language-server: $schema=../../schema/rektion.schema.json

basieren:
  pos: "verb"
  patterns:
    - prep: "auf"
      case: "dat"
      gloss:
        ru: "базироваться на чём-л."
        en: "to be based on sth."
      examples:
        - de: "Die Theorie basiert auf einem Irrtum."
          ru: "Теория базируется на заблуждении."
          en: "The theory is based on a fallacy."
      sources:
        - "prototype"

basteln:
  pos: "verb"
  patterns:
    - prep: "an"
      case: "dat"
      gloss:
        ru: "мастерить что-л., трудиться над чем-л."
        en: "to tinker with sth., to work on sth."
      examples:
        - de: "Er bastelt an seinem alten Auto."
          ru: "Он возится со своей старой машиной."
          en: "He is tinkering with his old car."
      sources:
        - "en.wiktionary"
        - "duden"

bauen:
  pos: "verb"
  patterns:
    - prep: "auf"
      case: "akk"
      gloss:
        ru: "рассчитывать на кого-л. / что-л."
        en: "to rely on sb. / sth., to count on sb. / sth."
      examples:
        - de: "Ich baue auf deinen Rat."
          ru: "Я рассчитываю на твой совет."
          en: "I am counting on your advice."
      sources:
        - "en.wiktionary"
        - "duden"

bedanken:
  pos: "verb"
  patterns:
    - prep: "bei"
      case: "dat"
      reflexive: "akk"
      gloss:
        ru: "благодарить кого-л."
        en: "to thank sb."
      examples:
        - de: "Ich bedanke mich bei dem Kollegen."
          ru: "Я благодарю коллегу."
          en: "I am thanking the colleague."
      sources:
        - "prototype"
      senseNote:
        ru: "кого благодаришь — адресат"
        en: "whom you thank — the addressee"
    - prep: "für"
      case: "akk"
      level: "A2"
      gloss:
        ru: "благодарить за что-л."
        en: "to thank for sth."
      examples:
        - de: "Ich bedanke mich für den Tipp."
          ru: "Благодарю за совет."
          en: "Thank you for the tip."
      sources:
        - "seed"
      reflexive: "akk"
      senseNote:
        ru: "за что благодаришь — повод. Оба вместе: Ich bedanke mich bei dir für die Hilfe"
        en: "what you thank for — the reason. Both at once: Ich bedanke mich bei dir für die Hilfe"

beeilen:
  pos: "verb"
  patterns:
    - prep: "mit"
      case: "dat"
      reflexive: "akk"
      gloss:
        ru: "торопиться с чем-л."
        en: "to hurry with sth., to get a move on with sth."
      examples:
        - de: "Ich beeile mich mit der Abrechnung."
          ru: "Я тороплюсь с отчётом."
          en: "I am hurrying with the invoice."
      sources:
        - "duden"

befassen:
  pos: "verb"
  patterns:
    - prep: "mit"
      case: "dat"
      reflexive: "akk"
      gloss:
        ru: "заниматься чем-л., рассматривать что-л."
        en: "to deal with sth., to occupy oneself with sth."
      examples:
        - de: "Der Ausschuss befasst sich mit diesem Problem."
          ru: "Комиссия занимается этой проблемой."
          en: "The committee is dealing with this problem."
      sources:
        - "duden"

befinden:
  pos: "verb"
  patterns:
    - prep: "über"
      case: "akk"
      gloss:
        ru: "выносить решение о чём-л. (офиц.)"
        en: "to rule on sth., to decide on sth. (formal)"
      examples:
        - de: "Über die Zahl der Teilnehmer befindet der Ausschuss."
          ru: "О числе участников решает комитет."
          en: "The committee rules on the number of participants."
      sources:
        - "duden"

befreunden:
  pos: "verb"
  patterns:
    - prep: "mit"
      case: "dat"
      reflexive: "akk"
      gloss:
        ru: "подружиться с кем-л."
        en: "to become friends with sb."
      examples:
        - de: "Sie hat sich mit ihrer Nachbarin befreundet."
          ru: "Она подружилась со своей соседкой."
          en: "She became friends with her neighbor."
      sources:
        - "en.wiktionary"
        - "duden"

begeistern:
  pos: "verb"
  patterns:
    - prep: "für"
      case: "akk"
      reflexive: "akk"
      gloss:
        ru: "увлекаться чем-л., загораться чем-л."
        en: "to get enthusiastic about sth."
      examples:
        - de: "Sie begeistert sich für die Malerei."
          ru: "Она увлекается живописью."
          en: "She is enthusiastic about painting."
      sources:
        - "en.wiktionary"
        - "duden"

begeistert:
  pos: "adj"
  patterns:
    - prep: "von"
      case: "dat"
      gloss:
        ru: "в восторге от кого-л. / чего-л."
        en: "delighted by sb. / sth., impressed by sb. / sth."
      examples:
        - de: "Ich bin begeistert von ihrem Gesang."
          ru: "Я в восторге от её пения."
          en: "I am delighted by her singing."
      sources:
        - "duden"
      senseNote:
        ru: "восторг от уже случившегося впечатления — не то же самое, что «begeistern für», где увлекаешься делом"
        en: "delight at an impression already received — not the same as 'begeistern für', where you get enthusiastic about doing sth."

Begeisterung:
  pos: "noun"
  article: "die"
  patterns:
    - prep: "über"
      case: "akk"
      gloss:
        ru: "восторг по поводу кого-л. / чего-л."
        en: "enthusiasm about sb. / sth."
      examples:
        - de: "Er zeigte seine Begeisterung über den Sieg."
          ru: "Он выразил свой восторг по поводу победы."
          en: "He showed his enthusiasm about the victory."
      sources:
        - "duden"
      senseNote:
        ru: "существительное к «begeistert von» — тот же восторг от впечатления, другое падежное оформление"
        en: "the noun form of 'begeistert von' — the same delight at an impression, a different case frame"

beginnen:
  pos: "verb"
  patterns:
    - prep: "mit"
      case: "dat"
      level: "A2"
      gloss:
        ru: "начинать с чего-л."
        en: "to begin with sth."
      examples:
        - de: "Der Kurs beginnt mit einem Test."
          ru: "Курс начинается с теста."
          en: "The course begins with a test."
      sources:
        - "seed"

begnügen:
  pos: "verb"
  patterns:
    - prep: "mit"
      case: "dat"
      reflexive: "akk"
      gloss:
        ru: "довольствоваться чем-л."
        en: "to content oneself with sth., to make do with sth."
      examples:
        - de: "Er begnügt sich mit dem, was er hat."
          ru: "Он довольствуется тем, что у него есть."
          en: "He makes do with what he has."
      sources:
        - "en.wiktionary"
        - "duden"

behängen:
  pos: "verb"
  patterns:
    - prep: "mit"
      case: "dat"
      reflexive: "akk"
      gloss:
        ru: "увешивать себя чем-л."
        en: "to festoon oneself with sth., to hang sth. all over oneself"
      examples:
        - de: "Sie behängt sich gern mit Strass."
          ru: "Она любит увешивать себя стразами."
          en: "She likes to festoon herself with rhinestones."
      sources:
        - "en.wiktionary"
        - "duden"

beharren:
  pos: "verb"
  patterns:
    - prep: "auf"
      case: "dat"
      gloss:
        ru: "настаивать на чём-л."
        en: "to insist on sth."
      examples:
        - de: "Sie beharrt auf ihrem Standpunkt."
          ru: "Она настаивает на своей точке зрения."
          en: "She insists on her point of view."
      sources:
        - "en.wiktionary"
        - "de.wiktionary"
        - "duden"

beitragen:
  pos: "verb"
  patterns:
    - prep: "zu"
      case: "dat"
      gloss:
        ru: "способствовать чему-л."
        en: "to contribute to sth."
      examples:
        - de: "Das trägt zum Erfolg bei."
          ru: "Это способствует успеху."
          en: "That contributes to the success."
      sources:
        - "prototype"

bekannt:
  pos: "adj"
  patterns:
    - prep: "für"
      case: "akk"
      gloss:
        ru: "известный чем-л."
        en: "known for sth."
      examples:
        - de: "Die Stadt ist bekannt für ihren Dom."
          ru: "Город известен своим собором."
          en: "The city is known for its cathedral."
      sources:
        - "prototype"
      senseNote:
        ru: "чем известен — слава, репутация"
        en: "what sth. is known for — fame, reputation"
    - prep: "mit"
      case: "dat"
      gloss:
        ru: "знакомый с кем-л. / чем-л."
        en: "acquainted with sb. / sth."
      examples:
        - de: "Ich bin mit seinem Problem seit Langem bekannt."
          ru: "Я давно знаком с его проблемой."
          en: "I have long been acquainted with his problem."
      sources:
        - "duden"
      senseNote:
        ru: "с кем/чем знаком — личная осведомлённость, а не слава"
        en: "who or what sb. is acquainted with — personal familiarity, not fame"

bekennen:
  pos: "verb"
  patterns:
    - prep: "zu"
      case: "dat"
      reflexive: "akk"
      gloss:
        ru: "признавать что-л., открыто заявлять о своей приверженности чему-л."
        en: "to profess/admit to sth., to own up to sth."
      examples:
        - de: "Er bekennt sich zu seinen Fehlern."
          ru: "Он признаёт свои ошибки."
          en: "He owns up to his mistakes."
      sources:
        - "en.wiktionary"
        - "duden"

beklagen:
  pos: "verb"
  patterns:
    - prep: "bei"
      case: "dat"
      level: "B2"
      gloss:
        ru: "жаловаться кому-л."
        en: "to complain to sb."
      senseNote:
        ru: "кому жалуешься — адресат, а не предмет"
        en: "whom you complain to — the addressee, not the subject"
      examples:
        - de: "Er beklagt sich bei dem Chef."
          ru: "Он жалуется начальнику."
          en: "He complains to the boss."
      sources:
        - "seed"
      reflexive: "akk"
    - prep: "über"
      case: "akk"
      level: "B2"
      gloss:
        ru: "жаловаться на что-л."
        en: "to complain about sth."
      senseNote:
        ru: "на что жалуешься — предмет жалобы"
        en: "what you complain about — the subject of the complaint"
      examples:
        - de: "Sie beklagt sich über den Lärm."
          ru: "Она жалуется на шум."
          en: "She complains about the noise."
      sources:
        - "seed"
      reflexive: "akk"

belaufen:
  pos: "verb"
  patterns:
    - prep: "auf"
      case: "akk"
      reflexive: "akk"
      gloss:
        ru: "составлять какую-л. сумму"
        en: "to amount to sth."
      examples:
        - de: "Der Schaden beläuft sich auf etwa 650 Euro."
          ru: "Ущерб составляет около 650 евро."
          en: "The damage amounts to about 650 euros."
          lemmaForm: beläuft
      sources:
        - "en.wiktionary"
        - "duden"

beneiden:
  pos: "verb"
  patterns:
    - prep: "um"
      case: "akk"
      gloss:
        ru: "завидовать кому-л. в чём-л."
        en: "to envy sb. sth."
      examples:
        - de: "Ich beneide dich um deine Ruhe."
          ru: "Я завидую твоему спокойствию."
          en: "I envy you your calm."
      sources:
        - "prototype"

bereit:
  pos: "adj"
  patterns:
    - prep: "für"
      case: "akk"
      gloss:
        ru: "готовый к чему-л. — подготовленный"
        en: "ready for sth. — prepared"
      examples:
        - de: "Ich bin bereit für die Prüfung."
          ru: "Я готов к экзамену."
          en: "I am ready for the exam."
      sources:
        - "prototype"
      senseNote:
        ru: "подготовлен к событию — к экзамену, к поездке"
        en: "prepared for an event — an exam, a trip"
    - prep: "zu"
      case: "dat"
      gloss:
        ru: "готовый пойти на что-л."
        en: "willing to do sth."
      examples:
        - de: "Ich bin zu einem Kompromiss bereit."
          ru: "Я готов на компромисс."
          en: "I am willing to make a compromise."
      sources:
        - "prototype"
      senseNote:
        ru: "согласен совершить действие — готов на это пойти"
        en: "willing to take an action — prepared to go that far"

berichten:
  pos: "verb"
  patterns:
    - prep: "über"
      case: "akk"
      level: "B1"
      gloss:
        ru: "сообщать, рассказывать о чём-л. — подробно"
        en: "to report on sth. — at length"
      senseNote:
        ru: "развёрнутый рассказ по существу темы"
        en: "a full account of the topic"
      examples:
        - de: "Die Zeitung berichtet über den Prozess."
          ru: "Газета сообщает о процессе."
          en: "The newspaper reports on the trial."
      sources:
        - "seed"
    - prep: "von"
      case: "dat"
      level: "B1"
      gloss:
        ru: "упоминать о чём-л. вскользь"
        en: "to mention sth. in passing"
      senseNote:
        ru: "беглое упоминание, а не разбор темы"
        en: "a passing mention rather than a treatment of the topic"
      examples:
        - de: "Er berichtet von seiner Reise."
          ru: "Он рассказывает о своей поездке."
          en: "He tells us about his trip."
      sources:
        - "seed"

berufen:
  pos: "verb"
  patterns:
    - prep: "auf"
      case: "akk"
      reflexive: "akk"
      gloss:
        ru: "ссылаться на кого-л. / что-л."
        en: "to invoke/cite sth. as justification"
      examples:
        - de: "Ich berufe mich auf dich als Zeugen."
          ru: "Я ссылаюсь на тебя как на свидетеля."
          en: "I am invoking you as a witness."
      sources:
        - "en.wiktionary"
        - "duden"

beruhen:
  pos: "verb"
  patterns:
    - prep: "auf"
      case: "dat"
      gloss:
        ru: "основываться на чём-л."
        en: "to rest on sth."
      examples:
        - de: "Das beruht auf einem Missverständnis."
          ru: "Это основано на недоразумении."
          en: "That rests on a misunderstanding."
      sources:
        - "prototype"

beschäftigen:
  pos: "verb"
  patterns:
    - prep: "mit"
      case: "dat"
      reflexive: "akk"
      gloss:
        ru: "заниматься чем-л."
        en: "to occupy oneself with sth."
      examples:
        - de: "Er beschäftigt sich mit der Geschichte."
          ru: "Он занимается историей."
          en: "He occupies himself with history."
      sources:
        - "prototype"

Beschäftigung:
  pos: "noun"
  article: "die"
  patterns:
    - prep: "mit"
      case: "dat"
      gloss:
        ru: "занятие чем-л."
        en: "engagement with sth., dealing with sth."
      examples:
        - de: "Die Beschäftigung mit Fragen der Politik interessiert ihn."
          ru: "Его интересуют занятия политическими вопросами."
          en: "He is interested in engaging with political questions."
      sources:
        - "duden"

beschließen:
  pos: "verb"
  patterns:
    - prep: "über"
      case: "akk"
      gloss:
        ru: "принимать решение по какому-л. вопросу (голосованием)"
        en: "to decide on sth., to vote on sth."
      examples:
        - de: "Das Parlament beschließt über den neuen Haushalt."
          ru: "Парламент принимает решение по новому бюджету."
          en: "Parliament is voting on the new budget."
      sources:
        - "duden"

beschränken:
  pos: "verb"
  patterns:
    - prep: "auf"
      case: "akk"
      reflexive: "akk"
      gloss:
        ru: "ограничивать(ся) чем-л."
        en: "to limit oneself/sth. to sth."
      examples:
        - de: "Er beschränkt sich auf das Wesentliche."
          ru: "Он ограничивается самым необходимым."
          en: "He limits himself to the essentials."
      sources:
        - "en.wiktionary"
        - "duden"

Beschwerde:
  pos: "noun"
  article: "die"
  patterns:
    - prep: "gegen"
      case: "akk"
      gloss:
        ru: "жалоба на кого-л."
        en: "complaint against sb."
      examples:
        - de: "Er reicht eine Beschwerde gegen den Nachbarn ein."
          ru: "Он подаёт жалобу на соседа."
          en: "He files a complaint against his neighbor."
      sources:
        - "duden"
      senseNote:
        ru: "на кого жалоба — против конкретного человека"
        en: "who the complaint is against — a specific person"
    - prep: "über"
      case: "akk"
      gloss:
        ru: "жалоба на что-л."
        en: "complaint about sth."
      examples:
        - de: "Er reicht eine Beschwerde über den Lärm ein."
          ru: "Он подаёт жалобу на шум."
          en: "He files a complaint about the noise."
      sources:
        - "duden"
      senseNote:
        ru: "на что жалоба — предмет или обстоятельство, а не человек"
        en: "what the complaint is about — a matter or circumstance, not a person"
    - prep: "bei"
      case: "dat"
      gloss:
        ru: "жалоба кому-л. (в какую инстанцию подана)"
        en: "complaint filed with sb./sth. (the authority it goes to)"
      examples:
        - de: "Ich werde bei Ihrem Vorgesetzten Beschwerde einlegen."
          ru: "Я подам жалобу вашему начальнику."
          en: "I will file a complaint with your supervisor."
      sources:
        - "duden"
      senseNote:
        ru: "кому подана жалоба — инстанция или лицо, рассматривающее её, а не виновник и не предмет"
        en: "who the complaint is filed with — the authority handling it, not the target or the subject"

beschweren:
  pos: "verb"
  patterns:
    - prep: "bei"
      case: "dat"
      reflexive: "akk"
      gloss:
        ru: "жаловаться кому-л."
        en: "to complain to sb."
      examples:
        - de: "Er beschwert sich bei dem Chef."
          ru: "Он жалуется начальнику."
          en: "He complains to the boss."
      sources:
        - "prototype"
      senseNote:
        ru: "кому жалуешься — адресат"
        en: "whom you complain to — the addressee"
    - prep: "über"
      case: "akk"
      reflexive: "akk"
      gloss:
        ru: "жаловаться на что-л."
        en: "to complain about sth."
      examples:
        - de: "Sie beschwert sich über den Service."
          ru: "Она жалуется на обслуживание."
          en: "She complains about the service."
      sources:
        - "prototype"
      senseNote:
        ru: "на что жалуешься — предмет жалобы"
        en: "what you complain about — the subject of the complaint"

besinnen:
  pos: "verb"
  patterns:
    - prep: "auf"
      case: "akk"
      reflexive: "akk"
      gloss:
        ru: "обращаться мыслями к чему-л., вспоминать о чём-л."
        en: "to recall sth., to reconnect with sth."
      examples:
        - de: "Er besinnt sich auf seine Wurzeln."
          ru: "Он обращается мыслями к своим корням."
          en: "He is reconnecting with his roots."
      sources:
        - "en.wiktionary"
        - "duden"

Besinnung:
  pos: "noun"
  article: "die"
  patterns:
    - prep: "auf"
      case: "akk"
      gloss:
        ru: "возврат к чему-л., сосредоточение на главном"
        en: "a return to sth., a refocusing on sth. (the essentials)"
      examples:
        - de: "Nach der Krise kam es zu einer Besinnung auf das Wesentliche."
          ru: "После кризиса произошёл возврат к главному."
          en: "After the crisis there was a return to the essentials."
      sources:
        - "duden"

besorgt:
  pos: "adj"
  patterns:
    - prep: "um"
      case: "akk"
      gloss:
        ru: "обеспокоенный за кого-л. / чем-л."
        en: "worried about sb. / sth."
      examples:
        - de: "Er ist sehr besorgt um ihre Gesundheit."
          ru: "Он очень обеспокоен её здоровьем."
          en: "He is very worried about her health."
      sources:
        - "duden"

beständig:
  pos: "adj"
  patterns:
    - prep: "gegen"
      case: "akk"
      gloss:
        ru: "устойчивый к чему-л."
        en: "resistant to sth."
      examples:
        - de: "Dieses Material ist beständig gegen Hitze."
          ru: "Этот материал устойчив к жаре."
          en: "This material is resistant to heat."
      sources:
        - "en.wiktionary"
        - "duden"

Bestehen:
  pos: "noun"
  article: "das"
  slugSuffix: 2
  patterns:
    - prep: "auf"
      case: "dat"
      gloss:
        ru: "упорное настаивание на чём-л."
        en: "dogged insistence on sth."
      examples:
        - de: "Sein trotziges Bestehen auf vermeintlichen Rechten verärgerte alle."
          ru: "Его упрямое настаивание на мнимых правах разозлило всех."
          en: "His stubborn insistence on supposed rights annoyed everyone."
      sources:
        - "duden"

bestehen:
  pos: "verb"
  patterns:
    - prep: "auf"
      case: "dat"
      level: "B2"
      gloss:
        ru: "настаивать на чём-л."
        en: "to insist on sth."
      senseNote:
        ru: "auf здесь всегда Dativ — правило wo / wohin к предложному объекту не применяется"
        en: "auf is Dativ here — the wo / wohin rule does not reach a prepositional object"
      examples:
        - de: "Er besteht auf seinem Recht."
          ru: "Он настаивает на своём праве."
          en: "He insists on his right."
      clause:
        dass: true
        zuInf: true
        indirect: false
      sources:
        - "seed"
    - prep: "aus"
      case: "dat"
      level: "B1"
      gloss:
        ru: "состоять из чего-л."
        en: "to consist of sth."
