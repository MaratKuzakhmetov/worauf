<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@400;600;700&family=Fira+Sans:wght@400;500;600&family=Fira+Sans+Condensed:wght@600&family=Fira+Mono&display=swap">
  <style>
    body { margin: 0; }
    a { color: #3182ce; } a:hover { color: #589ddb; }

    /* Theme lives in a real stylesheet, so the switch is one class, not a dozen holes.
       Dark is the navy blueprint from markgp.com; light is cool graph paper. */
    .t-light {
      --paper: #fbfcfe; --card: #ffffff; --panel: #eef2f7;
      --ink: #1a202c; --ink-2: #6b7688; --ink-3: rgba(26,32,44,.22);
      --hair: rgba(26,32,44,.1); --grid: rgba(26,32,44,.055); --mark: #ffe08a;
      --akk: #1f3fcb; --dat: #b26205;
      --en-bg: #1a202c; --en-fg: #fbfcfe; --ru-bg: transparent; --ru-fg: #1a202c;
    }
    .t-dark {
      --paper: #151a26; --card: #1e2433; --panel: #232b3d;
      --ink: #f7fafc; --ink-2: #9aa7bd; --ink-3: rgba(247,250,252,.24);
      --hair: rgba(247,250,252,.12); --grid: rgba(247,250,252,.05); --mark: rgba(255,224,138,.3);
      --akk: #7c93ff; --dat: #e9a13b;
      --en-bg: #f7fafc; --en-fg: #151a26; --ru-bg: transparent; --ru-fg: #f7fafc;
    }
  </style>
</helmet>

<!--
  The review state after a wrong answer — the one screen this project exists to show.
  The unchosen option is dimmed with INK, never opacity: the contrast pass measured
  the old `opacity: .55` at 2.16:1 on the case label. The case label is never dimmed.
-->
<div class="{{themeClass}}" style="
  width: 1440px; height: 900px; overflow: hidden;
  display: flex; flex-direction: column;
  font-family: 'Fira Sans', system-ui, sans-serif;
  color: var(--ink);
  background-color: var(--paper);
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
">

  <!-- header -->
  <div style="display: flex; align-items: center; gap: 18px; padding: 0 22px; height: 64px; flex-shrink: 0; border-bottom: 2px solid var(--ink);">
    <div style="font-family: 'Shantell Sans', cursive; font-weight: 700; font-size: 21px;">
      <span style="color: var(--akk);">wo</span><span>rauf?</span>
    </div>
    <div style="display: flex; gap: 6px; margin-left: auto; align-items: center;">
      <div style="font-family: 'Shantell Sans', cursive; font-weight: 700; font-size: 14px; border: 2px solid transparent; padding: 6px 15px;">{{t.browse}}</div>
      <div style="font-family: 'Shantell Sans', cursive; font-weight: 700; font-size: 14px; background: var(--ink); color: var(--paper); border: 2px solid var(--ink); border-radius: 4px; padding: 6px 15px;">{{t.practice}}</div>
      <div style="width: 1px; height: 22px; background: var(--ink-3); margin: 0 8px;"></div>
      <div style="font-family: 'Fira Mono', monospace; font-size: 12px; background: var(--en-bg); color: var(--en-fg); border-radius: 3px; padding: 4px 8px;">EN</div>
      <div style="font-family: 'Fira Mono', monospace; font-size: 12px; background: var(--ru-bg); color: var(--ru-fg); border-radius: 3px; padding: 4px 8px;">RU</div>
    </div>
  </div>

  <!-- session body -->
  <div style="flex: 1; min-height: 0; display: flex; justify-content: center; padding: 40px 0;">
    <div style="width: 760px;">

      <div style="display: flex; align-items: center; gap: 16px;">
        <div style="display: flex; gap: 5px; flex: 1;">
          <sc-for list="{{ticks}}" as="tick" hint-placeholder-count="12">
            <div style="height: 4px; flex: 1; background: {{tick.bg}}; border-radius: 2px;"></div>
          </sc-for>
        </div>
        <span style="font-family: 'Fira Mono', monospace; font-size: 13px;">4 / 12</span>
        <div style="display: flex; align-items: center; gap: 7px; border: 2px solid var(--ink); border-radius: 4px; padding: 5px 11px;">
          <span style="font-family: 'Shantell Sans', cursive; font-weight: 700; font-size: 13px;">{{t.finish}}</span>
          <span style="font-family: 'Fira Mono', monospace; font-size: 10px; border: 1px solid var(--ink-3); border-radius: 3px; padding: 0 4px;">Esc</span>
        </div>
      </div>

      <div style="height: 2px; background: var(--ink-3); border-radius: 2px; margin-top: 22px;"></div>

      <!-- prompt -->
      <div style="font-family: 'Shantell Sans', cursive; font-weight: 700; font-size: 14px; letter-spacing: .05em; color: var(--ink-2); margin-top: 30px;">
        {{t.whichCase}}
      </div>
      <div style="display: flex; align-items: baseline; gap: 14px; margin-top: 12px;">
        <span style="font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif; font-weight: 600; font-size: 42px;" lang="de">bestehen</span>
        <span style="font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif; font-weight: 600; font-size: 42px; color: var(--dat);" lang="de">auf</span>
        <span style="width: 130px; height: 3px; background: var(--ink-2); border-radius: 2px; margin-bottom: 9px;"></span>
      </div>
      <div style="font-size: 17px; color: var(--ink-2); margin-top: 6px;">{{t.insistGloss}}</div>

      <!-- auf governs Akkusativ and Dativ, so there are exactly two options -->
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 26px;">

        <div style="
          background: var(--card); border: 3px solid var(--ink); border-radius: 5px;
          box-shadow: 4px 5px 0 0 var(--ink-3);
          padding: 15px 17px; display: flex; align-items: center; gap: 12px;
        ">
          <span style="font-family: 'Fira Mono', monospace; font-size: 12px; border: 1.5px solid var(--ink-3); border-radius: 3px; padding: 2px 6px;">1</span>
          <span style="font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif; font-weight: 600; font-size: 24px;" lang="de">auf dem Termin</span>
          <span style="margin-left: auto; font-family: 'Fira Mono', monospace; font-size: 10px; letter-spacing: .08em; color: var(--dat); text-align: right; white-space: pre-line;">{{t.datCorrect}}</span>
        </div>

        <div style="
          background: var(--card); border: 2px dashed var(--ink-2); border-radius: 5px;
          padding: 15px 17px; display: flex; align-items: center; gap: 12px;
        ">
          <span style="font-family: 'Fira Mono', monospace; font-size: 12px; border: 1.5px solid var(--ink-3); border-radius: 3px; padding: 2px 6px;">2</span>
          <span style="font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif; font-weight: 600; font-size: 24px;" lang="de">auf den Termin</span>
          <span style="margin-left: auto; font-family: 'Fira Mono', monospace; font-size: 10px; letter-spacing: .08em; color: var(--akk); text-align: right; white-space: pre-line;">{{t.akkYours}}</span>
        </div>
      </div>

      <!-- why -->
      <div style="display: flex; gap: 22px; margin-top: 30px; padding-top: 20px; border-top: 2px solid var(--ink-3);">
        <div style="flex: 0 0 90px; font-family: 'Shantell Sans', cursive; font-weight: 700; font-size: 13px; letter-spacing: .06em; color: var(--ink-2); padding-top: 3px;">{{t.why}}</div>
        <div style="flex: 1; font-size: 18px; line-height: 1.55;">
          {{t.whyA}}
          <span style="box-shadow: inset 0 -8px 0 0 var(--mark);">{{t.whyHl}}</span>
          {{t.whyB}}
        </div>
      </div>

      <!-- actions -->
      <div style="display: flex; align-items: center; gap: 20px; margin-top: 30px;">
        <!-- focus is ink/paper inversion plus a visible ring, never a new colour -->
        <div style="
          background: var(--ink); color: var(--paper);
          border: 2px solid var(--ink); border-radius: 4px;
          box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--ink);
          padding: 13px 26px; display: flex; align-items: center; gap: 10px;
        ">
          <span style="font-family: 'Shantell Sans', cursive; font-weight: 700; font-size: 18px;">{{t.next}}</span>
          <span style="font-family: 'Fira Mono', monospace; font-size: 13px;">↵</span>
        </div>
        <span style="font-family: 'Shantell Sans', cursive; font-weight: 600; font-size: 15px; color: var(--ink-2); border-bottom: 2px solid var(--ink-2); padding-bottom: 1px;">
          {{t.openInBrowser}}
        </span>
      </div>

    </div>
  </div>

  <!-- status bar -->
  <div style="display: flex; align-items: center; padding: 0 22px; height: 34px; flex-shrink: 0; border-top: 2px solid var(--ink); background: var(--panel); font-family: 'Fira Mono', monospace; font-size: 12px; color: var(--ink-2);">
    <span>{{t.keys}}</span>
    <span style="margin-left: auto;">{{t.data}} 4b9bd00a15bb</span>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{
  "dark": {"editor": "boolean", "default": true, "section": "Theme"},
  "locale": {"editor": "enum", "options": ["en", "ru"], "default": "en", "section": "Theme"},
  "$preview": {"width": 1440, "height": 900}
}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? true;
    const locale = this.props.locale ?? 'en';

    const themeClass = dark ? 't-dark' : 't-light';

    /* 3 answered, the 4th in play, the rest untouched. */
    const ticks = [];
    for (let i = 0; i < 12; i++) {
      ticks.push({ bg: i === 0 ? 'var(--dat)' : i < 3 ? 'var(--ink)' : 'var(--ink-3)' });
    }

    const en = {
      browse: 'Browse', practice: 'Practice',
      finish: 'Finish', whichCase: 'WHICH CASE?',
      insistGloss: 'to insist on sth.',
      datCorrect: 'DATIV\nCORRECT', akkYours: 'AKKUSATIV\nYOUR ANSWER',
      why: 'WHY',
      whyA: 'auf is a Wechselpräposition, so “wohin?” would argue for Akkusativ — and that is exactly the trap.',
      whyHl: 'A prepositional object is not a place',
      whyB: ', so nothing about motion decides it. bestehen fixes Dativ lexically: it has to be known, not derived.',
      next: 'Next', openInBrowser: 'Open in the browser',
      keys: '1–2 choose · Enter next · Esc finish', data: 'data',
    };

    const ru = {
      browse: 'Справочник', practice: 'Тренажёр',
      finish: 'Закончить', whichCase: 'КАКОЙ ПАДЕЖ?',
      insistGloss: 'настаивать на чём-л.',
      datCorrect: 'DATIV\nВЕРНО', akkYours: 'AKKUSATIV\nВАШ ОТВЕТ',
      why: 'ПОЧЕМУ',
      whyA: 'auf — Wechselpräposition, и «wohin?» просилось бы в аккузатив. Это и есть ловушка.',
      whyHl: 'Предложный объект — не место',
      whyB: ', и направление здесь ничего не решает. bestehen задаёт датив лексически: это надо знать, а не выводить.',
      next: 'Дальше', openInBrowser: 'Открыть в справочнике',
      keys: '1–2 выбор · Enter дальше · Esc закончить', data: 'данные',
    };

    return { themeClass, ticks, t: locale === 'ru' ? ru : en };
  }
}
</script>
</body>
</html>
