name: CI

on:
  push:
    branches: [main, mvp]
  pull_request:
  workflow_dispatch:
  # Called by deploy.yml so a tag cannot ship something the checks never saw.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run

      # The build stays a check even though nothing here deploys it: `next dev` no longer
      # carries `output: 'export'` (ADR 0001), so this is the only place that catches a
      # feature the static export cannot do. Deployment is Cloudflare's job (ADR 0004).
      - run: npm run build
        env:
          # Everything that changes on deploy day. Unset builds fall back to a .invalid
          # host, so nothing ships a plausible-but-wrong canonical.
          NEXT_PUBLIC_SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
